services:
  discovery-server:
    build: ./discovery-server
    ports:
      - "8761:8761"

  product-service:
    build: ./product-service
    depends_on:
      discovery-server:
        condition: service_healthy

  order-service:
    build: ./order-service
    ports:
      - "8082:8080"
    depends_on:
      discovery-server:
        condition: service_healthy
      product-service:
        condition: service_healthy
